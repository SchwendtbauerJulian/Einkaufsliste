<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03a9f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Einkauf" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
  <title>Einkaufsliste</title>
</head>
<body>
  <header>
    <h1 id="title">Einkaufsliste</h1>
    <button id="status" class="status" type="button"></button>
    <button id="settings-btn" class="icon" type="button" aria-label="Einstellungen">⚙</button>
  </header>

  <main id="main">
    <form id="add" autocomplete="off">
      <input name="name" list="sugg" placeholder="z. B. 2 kg Mehl" aria-label="Artikel" enterkeyhint="done" />
      <input name="quantity" inputmode="decimal" placeholder="Menge" aria-label="Menge" />
      <select name="unit" aria-label="Einheit"></select>
      <button type="submit" class="primary" aria-label="Hinzufügen">+</button>
      <input name="note" class="wide" placeholder="Notiz (optional), z. B. Marke" aria-label="Notiz" />
    </form>
    <div id="list"></div>
  </main>

  <section id="settings" hidden>
    <h2>Einstellungen</h2>
    <label>Liste
      <select id="list-select"></select>
    </label>
    <p id="settings-msg" class="msg"></p>
    <div class="buttons">
      <button id="logout" type="button" class="link danger">Abmelden</button>
      <span class="spacer"></span>
      <button id="cancel-settings" type="button" class="link">Abbrechen</button>
      <button id="save-settings" type="button" class="primary text">Speichern</button>
    </div>
    <p id="sw-hint" class="hint"></p>
  </section>

  <dialog id="edit">
    <form method="dialog" autocomplete="off">
      <h2>Artikel bearbeiten</h2>
      <label>Name<input name="name" required /></label>
      <div class="row">
        <label>Menge<input name="quantity" inputmode="decimal" /></label>
        <label>Einheit<select name="unit"></select></label>
      </div>
      <label>Notiz<input name="note" placeholder="z. B. Marke, Bio, …" /></label>
      <div class="buttons">
        <button type="button" class="link danger" data-edit="delete">Löschen</button>
        <span class="spacer"></span>
        <button type="button" class="link" data-edit="cancel">Abbrechen</button>
        <button type="submit" class="primary text">Speichern</button>
      </div>
    </form>
  </dialog>

  <datalist id="sugg"></datalist>
  <script src="app.js"></script>
</body>
</html>
