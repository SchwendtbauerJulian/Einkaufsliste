# Zugriff auf die Home-Assistant-API (Liste lesen/ändern, Benachrichtigung, Neustart)
homeassistant_api: true
# Schreibzugriff auf den Konfigurationsordner, um die Integration zu installieren
map:
  - homeassistant_config:rw
options:
  auto_restart: false
schema:
  auto_restart: bool
